[project]
name = "project-botc"
version = "0.1.0"
description = "LLM assistant for BOTC game masters"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "fastapi>=0.142.0",
    "httpx>=0.28.1",
    "numpy>=2.5.3",
    "ruff>=0.17.3",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "hypothesis>=6.170.1",
    "pyright>=1.1.414",
]
load = [
    "locust>=2.46.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests/"]

[tool.pyright]
include = ["src"]
typeCheckingMode = "standard"
strict = ["src"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botc"]
